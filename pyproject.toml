[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-viral-collector"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
media = ["faster-whisper>=1.1,<2", "imageio-ffmpeg>=0.5,<1", "opencc-python-reimplemented>=0.1.7,<0.2", "rapidocr-onnxruntime>=1.3,<2"]
proofreading = ["funasr-onnx>=0.4,<1", "pypinyin>=0.53,<1", "opencv-python>=4.8,<4.12"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
collect = "douyin_viral_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
